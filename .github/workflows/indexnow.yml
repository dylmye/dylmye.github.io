name: CI Checks

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.astro-indexnow-cache.json'

jobs:
  index-and-commit:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Set up PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: true
          cache: true
      
      - name: Run Astro checks
        run: pnpm run check
      
      - name: Astro build
        run: pnpm run build

      - name: Check if cache was updated
        id: dirty-check
        run: git status --porcelain -- '.astro-indexnow-cache.json' | grep -q . && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Commit updated cache
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .astro-indexnow-cache.json
          git commit -m "update indexnow cache [skip ci]"
          git push